name: secure_branch_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.10.4

# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
dependencies:
  flutter:
    sdk: flutter

  #Statemanagement
  flutter_hooks: ^0.21.2

  #Statemanagement and trigger obeservers bloc
  flutter_bloc: ^9.0.0

  # internationalizing and localization
  # dart run easy_localization:generate --source-dir ./assets/translations
  # dart run easy_localization:generate -S assets/translations -f keys -O lib/generated -o locale_keys.g.dart
  easy_localization: ^3.0.7

  #adapting screen and font size
  flutter_screenutil: ^5.9.3

  # widget can help you bring simple yet beautiful skeleton loaders
  shimmer_animation: ^2.2.1

  # Dependency Injection service locator
  get_it: ^9.2.0

  # Functional error handling in flutter
  multiple_result: ^5.1.0

  # Used to make HTTP requests
  dio: ^5.3.3

  # Dio interceptor that logs network calls in a pretty, easy to read format
  pretty_dio_logger: ^1.3.1

  #Loading animation
  flutter_spinkit: ^5.2.1

  # extensible logger which prints beautiful logs.
  logger: ^2.5.0

  # for splash screen
  flutter_native_splash: ^2.4.3

  # toast notifications
  toastification: ^3.0.1

  # An SVG rendering
  flutter_svg: ^2.0.14

  # load and cache network images. Can also be used with placeholder and error widgets.
  cached_network_image: ^3.4.1

  # Injectable Generator is a generator for injectable.
  injectable_generator: ^2.8.1

  # Dependency Injection service locator
  injectable: ^2.5.1

  # Hive is a lightweight and fast NoSQL database for storing data locally on the device.
  hive_ce: ^2.13.2

  # hive_flutter is a plugin that provides integration between Hive and Flutter.
  hive_ce_flutter: ^2.3.2

  # Generating code for JSON serialization and deserialization.
  json_annotation: ^4.10.0

  # Code generator package for Dart projects which allows you to easily serialize JSON objects.
  json_serializable: ^6.11.1

  # a package containing annotations for freezed.
  freezed_annotation: ^3.1.0

  # Code generator package for freezed
  freezed: ^3.2.3

  # Contains code to deal with internationalized/localized messages,
  intl: ^0.20.2

  # Flutter widgets implementing the current iOS design language.
  cupertino_icons: ^1.0.8

  # Cloud Firestore, a cloud-hosted, noSQL database with live synchronization and offline support
  cloud_firestore: ^6.0.1

  # enabling authentication
  firebase_auth: ^6.0.2

  # Firebase Core
  firebase_core: ^4.1.0

  # Firebase Crashlytics for reports uncaught errors to the Firebase console
  firebase_crashlytics: ^5.0.1

  # A declarative router and supporting deep linking
  go_router: ^17.1.0

  # plugin for launching a URL. Supports web, phone, SMS, and email schemes.
  url_launcher: ^6.3.1

  # Add features to the Android / iOS keyboard in a very simple way.
  keyboard_actions: ^4.2.0

  # plugin providing detailed information about the device (make, model, etc.), and Android or iOS version the app is running on.
  device_info_plus: ^12.1.0

  #Load configuration at runtime from a .env file which can be used throughout the application
  flutter_dotenv: ^6.0.0

  # A set of high-level APIs over PointyCastle for two-way cryptography
  encrypt: ^5.0.3

  # A Dart package that helps to implement value based equality without needing to explicitly override == and hashCode
  equatable: ^2.0.7

  # plugin for securely storing sensitive data using encrypted storage.
  flutter_secure_storage: ^10.0.0

  # beautiful animated effects & builders
  flutter_animate: ^4.5.2

  # Hardware-backed biometric signature for cryptographic authentication
  biometric_signature: ^9.0.3

  #plugin provides a cross-platform (iOS, Android) API for generic location (GPS etc.) functions
  geolocator: ^14.0.2

dev_dependencies:

  # A package which simplifies the task of updating your Flutter app's launcher icon
  flutter_launcher_icons: "^0.14.3"

  # Build Runner is a package that provides a concrete way of generating files using Dart code, outside of tools like pub and the Dart VM.
  # Use the below command to generate files:
  # `dart run build_runner build --delete-conflicting-outputs`
  build_runner: ^2.4.13

  # Extension for Hive. Automatically generates TypeAdapters to store any class.
  hive_ce_generator: ^1.9.3

  flutter_lints: ^6.0.0

  # Lint rules for Dart and Flutter used internally at Very Good Ventures.
  very_good_analysis: ^10.1.0

  # Change App Package Name with single command
  # dart run change_app_package_name:main com.new.package.name
  change_app_package_name: ^1.4.0

  flutter_test:
    sdk: flutter

flutter:

  uses-material-design: true
  assets:
    - assets/translations/
    - assets/icons/
    - assets/images/
    - .env

fonts:
  - family: DINNextLTArabic
    fonts:
      - asset: assets/fonts/ArbFONTS-DINNextLTArabic-Regular.ttf
        weight: 400
      - asset: assets/fonts/ArbFONTS-DINNextLTArabic-Medium.ttf
        weight: 500
      - asset: assets/fonts/ArbFONTS-DINNextLTArabic-Bold.ttf
        weight: 700

